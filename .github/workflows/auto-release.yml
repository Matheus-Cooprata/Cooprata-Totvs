name: Auto Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Versionar e Publicar Release
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout completo (com tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calcular próxima versão
        id: version
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [[ -z "$LAST_TAG" ]]; then
            LAST_TAG="v0.0.0"
            COMMITS=$(git log --pretty=format:"%s||%h||%ad" --date=short)
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s||%h||%ad" --date=short)
          fi
          if [[ -z "$COMMITS" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          IFS='.' read -r V_MAJOR V_MINOR V_PATCH <<< "${LAST_TAG#v}"
          BUMP="patch"
          while IFS= read -r line; do
            MSG=$(echo "$line" | cut -d'|' -f1)
            if echo "$MSG" | grep -qiP "BREAKING CHANGE|^(\X{1,3}\s*)?!:"; then BUMP="major"; break
            elif echo "$MSG" | grep -qP "^(\X{1,3}\s*)?feat(\(.+\))?:"; then BUMP="minor"
            fi
          done <<< "$COMMITS"
          case "$BUMP" in
            major) V_MAJOR=$((V_MAJOR + 1)); V_MINOR=0; V_PATCH=0 ;;
            minor) V_MINOR=$((V_MINOR + 1)); V_PATCH=0 ;;
            patch) V_PATCH=$((V_PATCH + 1)) ;;
          esac
          NEW_TAG="v${V_MAJOR}.${V_MINOR}.${V_PATCH}"
          if git tag | grep -qx "$NEW_TAG"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false"        >> "$GITHUB_OUTPUT"
          echo "new_tag=$NEW_TAG"  >> "$GITHUB_OUTPUT"
          echo "$COMMITS" > "$RUNNER_TEMP/commits.txt"

      - name: Gerar changelog
        if: steps.version.outputs.skip != 'true'
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          COMMITS=$(cat "$RUNNER_TEMP/commits.txt")
          feats=""; fixes=""; chores=""; others=""
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            msg=$(echo "$line"  | awk -F'\\|\\|' '{print $1}')
            hash=$(echo "$line" | awk -F'\\|\\|' '{print $2}')
            dt=$(echo "$line"   | awk -F'\\|\\|' '{print $3}')
            entry="- ${msg} (\`${hash}\`) _${dt}_"
            if echo "$msg" | grep -qP "^(\X{1,3}\s*)?feat(\(.+\))?:";    then feats="${feats}\n${entry}"
            elif echo "$msg" | grep -qP "^(\X{1,3}\s*)?fix(\(.+\))?:";   then fixes="${fixes}\n${entry}"
            elif echo "$msg" | grep -qP "^(\X{1,3}\s*)?chore(\(.+\))?:"; then chores="${chores}\n${entry}"
            else others="${others}\n${entry}"; fi
          done <<< "$COMMITS"
          {
            echo "## [$NEW_TAG] — $TODAY"; echo ""
            if [[ -n "$feats" ]];   then echo "### Novidades";  printf "%b\n" "$feats";  echo ""; fi
            if [[ -n "$fixes" ]];   then echo "### Correções";  printf "%b\n" "$fixes";  echo ""; fi
            if [[ -n "$chores" ]];  then echo "### Manutenção"; printf "%b\n" "$chores"; echo ""; fi
            if [[ -n "$others" ]];  then echo "### Outros";     printf "%b\n" "$others"; echo ""; fi
          } > "$RUNNER_TEMP/new_block.md"

      - name: Atualizar CHANGELOG.md
        if: steps.version.outputs.skip != 'true'
        run: |
          CHANGELOG="CHANGELOG.md"
          [[ ! -f "$CHANGELOG" ]] && printf '# Changelog\n\nTodas as mudanças notáveis neste projeto serão documentadas aqui.\n\n---\n\n' > "$CHANGELOG"
          HEADER_END=$(grep -n "^---$" "$CHANGELOG" | head -n1 | cut -d: -f1)
          if [[ -n "$HEADER_END" ]]; then
            INSERT_AT=$((HEADER_END + 1))
            { head -n "$HEADER_END" "$CHANGELOG"; echo ""; cat "$RUNNER_TEMP/new_block.md"; tail -n +"$INSERT_AT" "$CHANGELOG"; } > "${CHANGELOG}.tmp" && mv "${CHANGELOG}.tmp" "$CHANGELOG"
          else
            { echo ""; cat "$RUNNER_TEMP/new_block.md"; } >> "$CHANGELOG"
          fi

      - name: Commit, Tag e Push
        if: steps.version.outputs.skip != 'true'
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          git add CHANGELOG.md
          git commit -m "chore(release): $NEW_TAG [skip ci]"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin HEAD:${{ github.event.repository.default_branch }}
          git push origin "$NEW_TAG"

      - name: Criar GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          gh release create "$NEW_TAG" \
            --title "Release $NEW_TAG" \
            --notes-file "$RUNNER_TEMP/new_block.md" \
            --latest
